syntax = "proto3";

package kale.auth.v1;

option csharp_namespace = "Auth.Contracts.V1";

// Client apps cache the result per role and evict it when a "role edited" event arrives.
// A role of another application returns NOT_FOUND.
service RoleService {
  rpc GetEffectiveOperations(GetEffectiveOperationsRequest) returns (GetEffectiveOperationsResponse);
}

message GetEffectiveOperationsRequest {
  string role_id = 1;  // UUID
}

message GetEffectiveOperationsResponse {
  // Qualified names ("billing.InvoiceRead"), with implications expanded and obsolete operations removed.
  repeated string operations = 1;
}
